name: "🐛 Bug Report / 问题反馈"
description: "Report a code error, integration bug, or Docker deployment issue"
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please fill out this form to report a bug. / 请填写此表单报告代码或部署配置错误。
  - type: textarea
    id: description
    attributes:
      label: "Bug Description / 问题描述"
      description: "A clear description of what the issue is."
      placeholder: "e.g., UnionPay checkout returns signature check failure on dev environment..."
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: "Reproduction Steps / 复现步骤"
      description: "How can we reproduce the error?"
      placeholder: |
        1. Set configuration...
        2. Initiate payment checkout...
        3. See error logs...
    validations:
      required: true
